apiVersion: gh-infra/v1
kind: FileSet
metadata:
  name: ci
  owner: wpfleger96

spec:
  repositories:
    - name: ai-agent-rules
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            e2e: "true"
    - claude-code-status-line
    - pagerduty-mcp-server
    - JamBot
    - meowdb
    - BOOTLEG
    - name: envsync
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            system_packages: "libsqlcipher-dev"
    - name: recall
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            git_identity: "true"
    - name: shell-configs
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            shell: "true"
            e2e: "true"
    - name: SNORE
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            web: "ui"
            web_pm: "pnpm"
            e2e: "true"
    - name: syncify
      overrides:
        - path: .github/workflows/ci.yml
          vars:
            web: "ui/web"
            web_pm: "npm"

  files:
    - path: .github/workflows/ci.yml
      source: ./templates/ci-python.yml

  via: push
  commit_message: |-
    ci: sync CI workflow<% if .Source.URL %>

    Source: <% .Source.URL %><% end %>

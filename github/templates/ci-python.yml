# This file is managed by github-config. Do not edit manually.
# https://github.com/wpfleger96/github-config
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
<%- if (index .Vars "shell") %>
          - name: lint
            recipe: lint-python-check lint-shell-check
          - name: format
            recipe: format-python-check format-shell-check
<%- else %>
          - name: lint
            recipe: lint-check
          - name: format
            recipe: format-check
<%- end %>
          - name: type-check
            recipe: type-check
          - name: test
            recipe: test
<%- if (index .Vars "web") %>
          - name: web
            recipe: web-install web-check
<%- end %>

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
      <%- if (index .Vars "web") %>
      <%- if eq (index .Vars "web_pm") "pnpm" %>

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        if: matrix.name == 'web'
        with:
          package_json_file: <% index .Vars "web" %>/package.json
      <%- end %>

      - name: Set up Node
        uses: actions/setup-node@v7
        if: matrix.name == 'web'
        with:
          node-version-file: <% index .Vars "web" %>/.node-version
          cache: <% index .Vars "web_pm" %>
          cache-dependency-path: <% index .Vars "web" %>/<% if eq (index .Vars "web_pm") "pnpm" %>pnpm-lock.yaml<% else %>package-lock.json<% end %>
      <%- end %>
      <%- if (index .Vars "shell") %>

      - name: Install shfmt
        uses: mfinelli/setup-shfmt@v4
        if: contains(matrix.recipe, 'shell')
      <%- end %>
      <%- if (index .Vars "system_packages") %>

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y <% index .Vars "system_packages" %>
      <%- end %>
      <%- if (index .Vars "git_identity") %>

      - name: Configure git identity
        if: matrix.name == 'test'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      <%- end %>

      - name: Install dependencies
<%- if (index .Vars "web") %>
        if: matrix.name != 'web'
<%- end %>
        run: just sync

      - name: Run ${{ matrix.name }}
        run: just ${{ matrix.recipe }}

  checks:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest

    steps:
      - name: Verify all checks passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "One or more checks failed"
            exit 1
          fi
<%- if (index .Vars "e2e") %>

  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "latest"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@v4
      <%- if (index .Vars "system_packages") %>

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y <% index .Vars "system_packages" %>
      <%- end %>

      - name: Install dependencies
        run: just sync

      - name: Run end-to-end tests
        run: just test-e2e
<%- end %>

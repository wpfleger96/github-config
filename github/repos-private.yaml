apiVersion: gh-infra/v1
kind: RepositorySet
metadata:
  owner: wpfleger96

# Private repos. Public repos live in repos-public.yaml. List each repo in
# exactly one of the two files: gh-infra plans both entries, so a repo in both
# flips between profiles on every apply. Changing a repo's visibility is not
# always a plain move of its entry: see "Public and private RepositorySets" in
# AGENTS.md. Entries here set visibility only as the first step of a private →
# public change.
#
# This profile differs from the public one because GitHub Free can't apply
# rulesets (403), fork_pr_approval (rejected), or allow_auto_merge (silently
# ignored, infinite plan drift) to private repos, and GitHub doesn't offer
# secret scanning or push protection on user-owned private repos. Private
# vulnerability reporting, workflow write permissions, and the release-app
# variables/secret are left off by policy choice.
defaults:
  reconcile:
    labels: additive
  spec:
    # Identical in repos-public.yaml (YAML anchors can't cross files); keep in sync.
    archived: false
    features:
      issues: true
      projects: true
      wiki: false
      discussions: false
      pull_requests: true
    release_immutability: false
    # The issue forms (files-issues.yaml) apply these labels; GitHub silently
    # drops a form label that doesn't exist. Values match GitHub's defaults.
    labels:
    - name: bug
      color: d73a4a
      description: "Something isn't working"
    - name: enhancement
      color: a2eeef
      description: "New feature or request"

    # End of the block shared with repos-public.yaml. Private profile below;
    # repos-public.yaml repeats these blocks with the public-only settings
    # added or flipped, so keep their other fields in sync.
    visibility: private
    # merge_commit_title/message omitted: merge commits are disabled, and gh-infra
    # rejects changes to a disabled type's title/message (babarot/gh-infra#177).
    # Add them back in the same change if allow_merge_commit is ever enabled.
    merge_strategy:
      allow_merge_commit: false
      allow_squash_merge: true
      allow_rebase_merge: false
      auto_delete_head_branches: true
      squash_merge_commit_title: PR_TITLE
      squash_merge_commit_message: PR_BODY
    security:
      vulnerability_alerts: true
      automated_security_fixes: false
      private_vulnerability_reporting: false
    actions:
      enabled: true
      allowed_actions: all
      sha_pinning_required: false
      workflow_permissions: read
      can_approve_pull_requests: true

repositories:
- name: recall
  spec:
    description: "Recall is a GitHub-backed markdown wiki exposed to agents via MCP server"
    topics:
    - python
    - mcp
    - knowledge-base
    - markdown
- name: homelabconfigs
  spec:
    description: "Homelab infrastructure configuration — Terraform, Ansible, and Raspberry Pi"
    topics:
    - homelab
    - terraform
    - ansible
    - raspberry-pi
- name: syncify
  spec:
    description: "Self-hosted music library sync — Python backend, React frontend, Docker Compose"
    topics:
    - python
    - music
    - self-hosted
    - docker
- name: envsync
  spec:
    description: "Load secrets from Enpass password manager into environment variables"
    topics:
    - python
    - enpass
    - secrets
    - cli
- name: BOOTLEG
  spec:
    description: "Multi-platform fantasy football aggregator — FastAPI REST API and MCP server"
    topics:
    - python
    - fastapi
    - mcp
- name: chartright
  spec:
    description: "Self-hosted SMART on FHIR engine that syncs your health records into portable FHIR R4 bundles and optionally feeds a fasten-onprem viewer"
    topics:
    - typescript
    - fhir
    - smart-on-fhir
    - health-records
    - self-hosted
# medical and financial have no code, so nothing should run there.
- name: medical
  spec:
    actions:
      enabled: false
- name: financial
  spec:
    actions:
      enabled: false

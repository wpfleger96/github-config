apiVersion: gh-infra/v1
kind: RepositorySet
metadata:
  owner: wpfleger96

# Public repos. Private repos live in repos-private.yaml. List each repo in
# exactly one of the two files: gh-infra plans both entries, so a repo in both
# flips between profiles on every apply (CI rejects duplicates). To change a
# repo's visibility, move its entry to the other file.
#
# Every entry sets visibility: public itself rather than inheriting it from
# defaults, so a private repo listed here by mistake fails to plan instead of
# going public. The public-only settings stay in this file because GitHub Free
# can't apply them to private repos: rulesets 403, fork_pr_approval is
# rejected, and allow_auto_merge is silently ignored (infinite plan drift).
# Private vulnerability reporting, workflow write permissions, and the
# release-app variables/secret are public-only by policy choice.
defaults:
  reconcile:
    labels: additive
  spec:
    # Identical in repos-private.yaml (YAML anchors can't cross files); keep in sync.
    archived: false
    features:
      issues: true
      projects: true
      wiki: false
      discussions: false
      pull_requests: true
    release_immutability: false
    # The issue forms (files-issues.yaml) apply these labels; GitHub silently
    # drops a form label that doesn't exist. Values match GitHub's defaults.
    labels:
    - name: bug
      color: d73a4a
      description: "Something isn't working"
    - name: enhancement
      color: a2eeef
      description: "New feature or request"

    # End of the block shared with repos-private.yaml. Public profile below;
    # repos-private.yaml repeats these blocks without the public-only
    # settings, so keep their other fields in sync.
    # merge_commit_title/message omitted: merge commits are disabled, and gh-infra
    # rejects changes to a disabled type's title/message (babarot/gh-infra#177).
    # Add them back in the same change if allow_merge_commit is ever enabled.
    merge_strategy:
      allow_merge_commit: false
      allow_squash_merge: true
      allow_rebase_merge: false
      auto_delete_head_branches: true
      squash_merge_commit_title: PR_TITLE
      squash_merge_commit_message: PR_BODY
      allow_auto_merge: true
    security:
      vulnerability_alerts: true
      automated_security_fixes: false
      private_vulnerability_reporting: true
    actions:
      enabled: true
      allowed_actions: all
      sha_pinning_required: false
      workflow_permissions: write
      can_approve_pull_requests: true
      fork_pr_approval: all_external_contributors
    # An entry's same-named ruleset replaces this one wholesale.
    rulesets:
    - name: main
      target: branch
      enforcement: active
      bypass_actors:
      - role: admin
        bypass_mode: always
      - app: id:3648544
        bypass_mode: always
      conditions:
        ref_name:
          include:
          - ~DEFAULT_BRANCH
      rules:
        pull_request:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: true
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
          - context: checks
            app: github-actions
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
    variables:
    - name: RELEASE_APP_ID
      value: "3648544"
    - name: RELEASE_APP_CLIENT_ID
      value: "Iv23lidipoTqvoMln1Di"
    secrets:
    - name: RELEASE_APP_PRIVATE_KEY
      value: "${ENV_RELEASE_APP_PRIVATE_KEY}"

repositories:
- name: ai-agent-rules
  spec:
    visibility: public
    description: "Manage configs for Claude Code, Codex, Gemini CLI, Goose, and Amp from one repo — symlinks, merge pipeline, profile inheritance, cross-machine sync"
    topics:
    - python
    - ai
    - llm
    - claude-code
    - coding-agents
    # ai-agent-rules has real e2e tests and opts into the e2e CI job, so require
    # the e2e context in addition to the default checks context.
    rulesets:
    - &main_e2e_ruleset
      name: main
      target: branch
      enforcement: active
      bypass_actors:
      - role: admin
        bypass_mode: always
      - app: id:3648544
        bypass_mode: always
      conditions:
        ref_name:
          include:
          - ~DEFAULT_BRANCH
      rules:
        pull_request:
          required_approving_review_count: 1
          dismiss_stale_reviews_on_push: true
          require_code_owner_review: false
          require_last_push_approval: true
          required_review_thread_resolution: true
        required_status_checks:
          strict_required_status_checks_policy: true
          contexts:
          - context: checks
            app: github-actions
          - context: e2e
            app: github-actions
        non_fast_forward: true
        deletion: true
        creation: false
        required_linear_history: false
        required_signatures: false
- name: claude-code-status-line
  spec:
    visibility: public
    description: "Real-time status bar for Claude Code showing model, context usage, session cost, git state, and token counts via the native status line hook"
    topics:
    - python
    - claude-code
    - cli
    - status-line
- name: pagerduty-mcp-server
  spec:
    visibility: public
    description: "MCP server exposing PagerDuty incidents, services, schedules, and on-calls to AI agents — read, acknowledge, resolve, with OAuth and API key auth"
    topics:
    - python
    - mcp
    - pagerduty
    - llm
- name: github-config
  spec:
    visibility: public
    description: "Declarative GitHub repo configuration management (gh-infra + Renovate)"
    topics:
    - github
    - gitops
    - renovate
    - gh-infra
    # Every action in this repo's workflows is pinned to a full commit SHA:
    # the release-app token they mint can read every managed repo.
    actions:
      enabled: true
      sha_pinning_required: true
- name: SNORE
  spec:
    visibility: public
    description: "Parses ResMed CPAP binary data, scores respiratory events against AASM clinical standards, and serves results via CLI, REST API, and Vue web UI"
    topics:
    - python
    - sleep
    - cpap
    # SNORE uses the managed ci-python.yml (web matrix leg for the Vue UI) and
    # opts into the e2e CI job, so require the e2e context in addition to the
    # default checks context.
    rulesets:
    - *main_e2e_ruleset
- name: JamBot
  spec:
    visibility: public
- name: meowdb
  spec:
    visibility: public
    description: "Personal cat meow audio library — record, upload, and play back clips via CLI, REST API, and web UI"
    topics:
    - python
    - fastapi
    - sqlite
- name: shell-configs
  spec:
    visibility: public
    description: "Declarative dev environment manager — shell configs, packages, VS Code/Cursor settings and extensions, git, GPG signing, gh CLI extensions, and iTerm2 profiles"
    topics:
    - python
    - dotfiles
    - shell
    - cli
    # shell-configs uses the managed ci-python.yml and opts into the e2e CI job,
    # so require the e2e context in addition to the default checks context.
    rulesets:
    - *main_e2e_ruleset

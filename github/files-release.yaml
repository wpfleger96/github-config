apiVersion: gh-infra/v1
kind: FileSet
metadata:
  name: release
  owner: wpfleger96

spec:
  repositories:
    - name: ai-agent-rules
      overrides:
        - path: release-please-config.json
          vars:
            package_name: ai-agent-rules
    - name: claude-code-status-line
      overrides:
        - path: release-please-config.json
          vars:
            package_name: claude-code-statusline
    - name: pagerduty-mcp-server
      overrides:
        - path: release-please-config.json
          vars:
            package_name: pagerduty_mcp_server
    - name: shell-configs
      overrides:
        - path: release-please-config.json
          vars:
            package_name: shell-configs
    - name: meowdb
      overrides:
        - path: release-please-config.json
          vars:
            package_name: meowdb
    - name: SNORE
      overrides:
        - path: release-please-config.json
          vars:
            package_name: snore
        # Auto-release temporarily disabled: render the workflow as manual-only
        # instead of push-to-main. Remove this override to re-enable.
        - path: .github/workflows/release.yml
          vars:
            manual_only: "true"

  files:
    - path: .github/workflows/release.yml
      source: ./templates/release.yml
    - path: release-please-config.json
      source: ./templates/release-please-config.json

  via: push
  commit_message: |-
    ci: sync release workflow<% if .Source.URL %>

    Source: <% .Source.URL %><% end %>

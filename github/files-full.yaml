apiVersion: gh-infra/v1
kind: FileSet
metadata:
  name: full
  owner: wpfleger96

spec:
  repositories:
    - ai-agent-rules
    - claude-code-status-line
    - pagerduty-mcp-server

  files:
    - path: .github/workflows/publish.yml
      source: ./templates/publish.yml

  via: push
  commit_message: |-
    ci: sync publish workflow<% if .Source.URL %>

    Source: <% .Source.URL %><% end %>

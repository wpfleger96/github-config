apiVersion: gh-infra/v1
kind: FileSet
metadata:
  owner: wpfleger96

spec:
  repositories:
    - ai-agent-rules
    - claude-code-status-line
    - pagerduty-mcp-server
    - JamBot
    - recall
    - name: SNORE
      overrides:
        - path: Justfile
          vars:
            web: "ui"
            web_pm: "pnpm"
    - name: shell-configs
      overrides:
        - path: Justfile
          vars:
            shell: "true"
    - meowdb
    - envsync
    - BOOTLEG

  files:
    - path: Justfile
      source: ./templates/Justfile

  via: push
  commit_message: |-
    chore: sync Justfile

    <% if .Source.URL %>Source: <% .Source.URL %><% end %>

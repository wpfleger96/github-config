apiVersion: gh-infra/v1
kind: FileSet
metadata:
  name: all
  owner: wpfleger96

spec:
  repositories:
    - ai-agent-rules
    - claude-code-status-line
    - pagerduty-mcp-server
    - JamBot
    - recall
    - SNORE
    - shell-configs
    - homelabconfigs
    - syncify
    - meowdb
    - envsync
    - BOOTLEG
    - chartright

  files:
    - path: renovate.json
      source: ./templates/renovate.json
    - path: .github/workflows/auto-approve.yml
      source: ./templates/auto-approve.yml

  via: push
  commit_message: |-
    ci: sync shared files<% if .Source.URL %>

    Source: <% .Source.URL %><% end %>

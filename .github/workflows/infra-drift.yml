name: Infra Drift Detection

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Clone gh-infra
        run: |
          git init -q /tmp/gh-infra
          git -C /tmp/gh-infra fetch -q --depth 1 https://github.com/wpfleger96/gh-infra.git "$(cat .gh-infra-ref)"
          git -C /tmp/gh-infra checkout -q FETCH_HEAD

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      - name: Build and install gh-infra
        run: |
          cd /tmp/gh-infra && go build -o gh-infra ./cmd/gh-infra/
          EXT_DIR="$(gh config get extensions_dir 2>/dev/null || echo "${HOME}/.local/share/gh/extensions")/gh-infra"
          mkdir -p "$EXT_DIR"
          mv gh-infra "$EXT_DIR/gh-infra"

      - name: Detect drift
        run: gh infra plan github/ --ci --diff
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
